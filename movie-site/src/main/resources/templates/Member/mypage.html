<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Film Box</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/Member/css/mypage.css?v=20260810-2"
        th:href="@{/Member/css/mypage.css(v='20260810-2')}" />
</head>

<body>
<header class="header">
    <div class="header-inner">
        <a href="/" class="logo">
            <div class="logo-mark">FB</div>
            Film Box
        </a>

        <nav class="main-nav">
            <a href="/">홈</a>
            <a href="/movies">영화/예매</a>
            <a href="/ranking">흥행영화순위</a>
            <a href="/genre">장르</a>
            <a href="/board">게시판</a>
        </nav>

        <div class="auth-nav">
            <a href="/login" data-role="login">로그인</a>
            <a href="/signup" data-role="signup">회원가입</a>
            <a href="/mypage" class="active" data-role="mypage" style="display:none;">마이페이지</a>
            <a href="#" data-role="logout" style="display:none;">로그아웃</a>
        </div>
    </div>
</header>

<main class="mypage">
    <section class="mypage-card">
        <h1 class="mypage-title">마이페이지</h1>
        <p class="mypage-sub">로그인한 회원 정보를 여기에 표시하면 됩니다.</p>

        <div class="profile-summary">
            <div id="profileBox" class="mypage-box">
                <p>회원 정보를 불러오는 중...</p>
            </div>

            <div class="account-edit-actions">
                <button id="accountEditToggle" class="account-edit-toggle" type="button"
                        aria-expanded="false" aria-controls="accountEditPanel">내 계정 수정</button>
            </div>
        </div>

        <section id="accountEditPanel" class="account-edit-panel" hidden aria-labelledby="accountEditTitle">
            <h2 id="accountEditTitle" class="section-title">내 계정 수정</h2>
            <p class="section-sub">아이디는 변경할 수 없습니다. 계정 보호를 위해 현재 비밀번호를 확인합니다.</p>

            <form id="accountEditForm" novalidate>
                <div class="account-form-grid">
                    <label class="account-field">
                        <span>아이디</span>
                        <input id="accountLoginId" type="text" readonly aria-readonly="true" />
                    </label>
                    <label class="account-field">
                        <span>현재 비밀번호 <em>필수</em></span>
                        <input id="accountCurrentPassword" type="password" autocomplete="current-password" required />
                    </label>
                    <label class="account-field">
                        <span>비밀번호 변경</span>
                        <input id="accountNewPassword" type="password" minlength="4"
                               autocomplete="new-password" placeholder="변경할 때만 입력 (4자 이상)" />
                    </label>
                    <label class="account-field">
                        <span>비밀번호 변경 확인</span>
                        <input id="accountNewPasswordConfirm" type="password" minlength="4"
                               autocomplete="new-password" placeholder="새 비밀번호를 다시 입력" />
                    </label>
                    <label class="account-field">
                        <span>이메일</span>
                        <input id="accountEmail" type="email" autocomplete="email" placeholder="name@example.com" />
                    </label>
                    <label class="account-field">
                        <span>휴대폰 번호</span>
                        <input id="accountPhone" type="tel" autocomplete="tel" inputmode="numeric"
                               placeholder="01012345678" />
                    </label>
                </div>

                <p id="accountEditMessage" class="account-edit-message" role="status" aria-live="polite"></p>

                <div class="account-form-actions">
                    <button id="accountEditCancel" class="account-cancel-btn" type="button">취소</button>
                    <button id="accountEditSubmit" class="account-submit-btn" type="submit">변경완료</button>
                </div>
            </form>
        </section>

        <hr class="divider" />

        <div class="reserve-lookup">
            <h2 class="section-title">예매 조회 / 수정</h2>
            <p class="section-sub">예매 완료 페이지에 표시된 10자리 예매번호를 입력해 주세요.</p>

            <div class="reserve-row">
                <input id="reservationNumberInput" class="reserve-input" type="text" maxlength="10"
                       placeholder="예매번호 10자리" autocomplete="off" />
                <button id="reservationSearchBtn" class="reserve-btn" type="button">조회</button>
            </div>

            <div id="reservationResult" class="reserve-result"></div>
        </div>

        <hr class="divider" />

        <div class="reserve-lookup">
            <h2 class="section-title">예매번호 찾기</h2>
            <p class="section-sub">회원 정보에 등록된 휴대폰 번호로 예매 내역에서 예매번호를 찾아옵니다.</p>

            <div class="reserve-row">
                <button id="findReservationNumbersBtn" class="reserve-btn reserve-btn-secondary" type="button">
                    내 예매번호 찾기
                </button>
            </div>

            <div id="reservationNumberList" class="reserve-result"></div>
        </div>
    </section>
</main>

<!-- 좌석 선택 모달 -->
<div id="seatModal" class="seat-modal hidden" aria-hidden="true">
    <div class="seat-modal-backdrop" id="seatModalBackdrop"></div>
    <div class="seat-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="seatModalTitle">
        <div class="seat-modal-header">
            <div id="seatModalTitle" class="seat-modal-title">좌석 선택</div>
            <button type="button" class="seat-modal-close" id="seatModalClose" aria-label="닫기">×</button>
        </div>

        <div class="seat-modal-body">
            <div class="screen">SCREEN</div>
            <div id="seatGrid" class="seat-grid"></div>

            <div class="legend">
                <div class="legend-item"><span class="legend-box"></span> 선택 가능</div>
                <div class="legend-item"><span class="legend-box selected"></span> 선택 좌석</div>
                <div class="legend-item"><span class="legend-box reserved"></span> 예약 완료</div>
            </div>

            <div class="seat-help" id="seatHelpText"></div>
        </div>

        <div class="seat-modal-footer">
            <button type="button" class="seat-confirm" id="seatModalConfirm">선택 완료</button>
        </div>
    </div>
</div>

<!-- ✅ 여기만 변경 -->
  <script src="/Member/js/index.js?v=20260817-1"
          th:src="@{/Member/js/index.js(v='20260817-1')}" defer></script>
  <script src="/Member/js/mypage.js?v=20260817-1"
          th:src="@{/Member/js/mypage.js(v='20260817-1')}" defer></script>

  <!-- ✅ 공통 Footer -->
  <div id="siteFooter"></div>
  <script src="/common/footer.js" defer></script>
</body>
</html>
