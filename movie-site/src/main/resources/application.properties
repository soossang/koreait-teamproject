# ================================
# App
# ================================
spring.application.name=movie-site
spring.config.import=optional:file:.env.properties

# 서버 포트
server.port=9090

# 요청/응답 인코딩
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ================================
# DataSource (MySQL)
# ================================
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/moviesite?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ================================
# JWT
# ================================
jwt.secret=${JWT_SECRET}
jwt.previous-secret=${JWT_PREVIOUS_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# ================================
# 파일 업로드 (옵션)
# ================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

logging.level.com.koreait.moviesite.RankingGenreBoard.service=INFO

# (선택) HikariCP 튜닝 설정 (필요하면 주석 해제)
# spring.datasource.hikari.minimum-idle=5
# spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.auto-commit=true
# spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# ================================
# 관리자 회원가입 코드
# 운영 환경에서는 ADMIN_REGISTRATION_CODE 환경변수로 반드시 변경하세요.
# ================================
app.admin.registration-code=${ADMIN_REGISTRATION_CODE:}

# 로컬에서 최초 관리자 계정이 필요할 때만 .env.properties에서 활성화합니다.
# 기존 관리자 계정의 비밀번호는 애플리케이션 시작 시 변경하지 않습니다.
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.login-id=${ADMIN_BOOTSTRAP_LOGIN_ID:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
